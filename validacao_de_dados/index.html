<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de dados</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Formulário de contato</h1>
    <form id="contact-form">
        <label for="nome">Nome: </label>
        <input type="text" id="nome" maxlength="256">

        <label for="email">Email:</label>
        <input type="email" id="email" maxlength="256">
        
        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone">

        <label for="senha">Senha:</label>
        <input type="password" id="senha" placeholder="Digite uma senha forte" aria-describedby="senha-requisitos senha-status">
        <p id="senha-requisitos">Use de 8 a 15 caracteres, com letra maiúscula, minúscula, número e símbolo ($, *, &, @ ou #).</p>
        <p id="senha-status" role="status" aria-live="polite" hidden></p>

        <label for="mensagem">Mensagem:</label>
        <textarea  id="mensagem"></textarea>
        <button type="submit">Enviar</button>
    </form>
    <script src="script.js"></script>
</body>
</html>
